<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Planet Gym — Check-In / Out</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .box { background: #fff; padding: 28px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    .gym-logo { width: 72px; height: 72px; object-fit: cover; border-radius: 14px; margin-bottom: 10px; }
    .gym-meta { margin: 0 0 16px; color: #64748b; font-size: 0.85rem; }
    input { width: 100%; padding: 14px; font-size: 1.1rem; border: 1.5px solid #cbd5e1; border-radius: 10px; margin: 12px 0; text-align: center; }
    button { width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; background: #2563eb; color: #fff; border: none; border-radius: 10px; cursor: pointer; }
    .status { padding: 16px; border-radius: 12px; margin-top: 16px; font-weight: 500; line-height: 1.45; }
    .success { background: #dcfce7; color: #166534; }
    .out { background: #dbeafe; color: #1e40af; border: 1.5px solid #60a5fa; }
    .soon { background: #fef9c3; color: #854d0e; border: 1.5px solid #eab308; }
    .warning { background: #fef2f2; color: #991b1b; border: 1.5px solid #ef4444; }
    .error { background: #fee2e2; color: #991b1b; }
    .link-btn { background: none; color: #64748b; font-size: 0.85rem; margin-top: 12px; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <img src="logo.png" alt="Fitness Planet Gym" class="gym-logo" onerror="this.style.display='none'" />
    <h2 style="margin:0 0 4px;">Fitness Planet Gym</h2>
    <p class="gym-meta">Periye • 📞 8606178119</p>
    <div id="form-area">
      <p style="color:#475569; margin:0; font-size:0.92rem;">Enter your registered 10-digit mobile number (saved for future visits):</p>
      <input id="phone" type="tel" maxlength="10" placeholder="9876543210" />
      <button id="submit-btn">Mark Entry / Exit</button>
    </div>
    <div id="result"></div>
    <button id="reset-phone" class="link-btn" style="display:none;">Not your number? Change mobile</button>
  </div>

  <script type="module">
    import { db, getTodayIST } from "./firebase-config.js";
    import { doc, runTransaction, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    const token = params.get("t");
    const formArea = document.getElementById("form-area");
    const resultEl = document.getElementById("result");
    const phoneInput = document.getElementById("phone");
    const resetBtn = document.getElementById("reset-phone");

    function showMsg(type, html) {
      resultEl.innerHTML = `<div class="status ${type}">${html}</div>`;
    }

    function formatDuration(startMs, endMs) {
      if (!startMs || !endMs || endMs <= startMs) return "";
      const mins = Math.round((endMs - startMs) / 60000);
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    async function findUnclosedPreviousAttendance(phone, today) {
      const q = query(
        collection(db, "attendance"),
        where("phone", "==", phone),
        where("status", "==", "IN")
      );
      const snap = await getDocs(q);
      return snap.docs.filter(d => (d.data().date || "") < today);
    }

    async function processScan(phone) {
      if (!token) return showMsg("error", "No QR token found. Please scan the QR at reception.");
      if (!/^\d{10}$/.test(phone)) return showMsg("error", "Please enter a valid 10-digit mobile number.");

      formArea.style.display = "none";
      showMsg("", "Verifying QR...");

      const nowMs = Date.now();
      const today = getTodayIST();
      const istTime = new Date(nowMs).toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit" });

      try {
        const staleDocs = await findUnclosedPreviousAttendance(phone, today);
        const staleRefs = staleDocs.map(d => d.ref);

        const res = await runTransaction(db, async (tx) => {
          const tokenRef = doc(db, "qr_tokens", "current");
          const memberRef = doc(db, "members", phone);
          const todayAttRef = doc(db, "attendance", `${today}_${phone}`);

          const reads = [
            tx.get(tokenRef),
            tx.get(memberRef),
            tx.get(todayAttRef),
            ...staleRefs.map(ref => tx.get(ref))
          ];
          const [tokenSnap, memberSnap, todayAttSnap, ...staleSnaps] = await Promise.all(reads);

          if (!tokenSnap.exists()) throw new Error("Kiosk QR is not active. Ask reception.");
          const tData = tokenSnap.data();

          if (tData.token !== token) throw new Error("QR expired. Please scan the fresh QR on screen.");
          if (tData.used) throw new Error("This QR was already used. Scan the fresh QR on screen.");
          if (!memberSnap.exists()) throw new Error("Mobile number not registered. Please contact 8606178119.");

          const member = memberSnap.data();
          const daysLeft = Math.round(
            (new Date(member.validUntil + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000
          );

          let feeStatus = "ACTIVE";
          if (daysLeft < 0) feeStatus = "EXPIRED";
          else if (daysLeft <= 5) feeStatus = "DUE_SOON";

          let closedPreviousDates = [];
          staleSnaps.forEach((sSnap, idx) => {
            if (sSnap.exists() && sSnap.data().status === "IN") {
              const prevData = sSnap.data();
              closedPreviousDates.push(prevData.date);
              tx.update(staleRefs[idx], {
                status: "AUTO_CLOSED",
                exitTime: prevData.exitTime || "Forgot Exit",
                autoClosedOn: today,
                lastTokenUsed: token
              });
            }
          });

          // If today's check-in already exists: mark EXIT on first exit scan
          if (todayAttSnap.exists()) {
            const attData = todayAttSnap.data();
            if (attData.exitTime) {
              throw new Error(`Exit already marked today at ${attData.exitTime}.`);
            }
            const duration = formatDuration(attData.entryAt || nowMs, nowMs);
            tx.update(todayAttRef, {
              exitTime: istTime,
              exitAt: nowMs,
              status: "OUT",
              duration: duration || "",
              lastTokenUsed: token
            });
            tx.update(tokenRef, {
              used: true,
              actionType: "EXIT",
              usedBy: member.name,
              scanTime: istTime,
              duration,
              feeStatus,
              daysLeft,
              validUntil: member.validUntil
            });
            return {
              mode: "EXIT",
              name: member.name,
              entryTime: attData.time || attData.entryTime || "",
              exitTime: istTime,
              duration,
              validUntil: member.validUntil,
              feeStatus,
              daysLeft,
              closedPreviousDates
            };
          }

          // Otherwise mark today's ENTRY
          tx.set(todayAttRef, {
            date: today,
            time: istTime,
            entryTime: istTime,
            entryAt: nowMs,
            exitTime: "",
            exitAt: null,
            status: "IN",
            phone,
            name: member.name,
            feeStatus,
            tokenUsed: token,
            lastTokenUsed: token
          });

          tx.update(tokenRef, {
            used: true,
            actionType: "ENTRY",
            usedBy: member.name,
            scanTime: istTime,
            feeStatus,
            daysLeft,
            validUntil: member.validUntil
          });

          return {
            mode: "ENTRY",
            name: member.name,
            entryTime: istTime,
            validUntil: member.validUntil,
            feeStatus,
            daysLeft,
            closedPreviousDates
          };
        });

        localStorage.setItem("gym_phone", phone);
        resetBtn.style.display = "block";

        const autoNote = res.closedPreviousDates.length
          ? `<br><span style="font-size:0.84rem; opacity:0.9;">(Closed previous open check-in from ${res.closedPreviousDates.join(", ")})</span>`
          : "";

        if (res.mode === "EXIT") {
          const durText = res.duration ? `<br>Duration: <b>${res.duration}</b>` : "";
          showMsg("out", `👋 Bye, <b>${res.name}</b>!<br><br>Entry: <b>${res.entryTime || "—"}</b> • Exit: <b>${res.exitTime}</b>${durText}${autoNote}`);
          return;
        }

        if (res.feeStatus === "EXPIRED") {
          showMsg("warning", `✅ Entry Marked for <b>${res.name}</b> at <b>${res.entryTime}</b>${autoNote}<br><br>⚠️ <b>Fee Expired on ${res.validUntil}</b>.<br>Please renew your membership at reception.`);
        } else if (res.feeStatus === "DUE_SOON") {
          const dueText = res.daysLeft === 0 ? "expires <b>today</b>" : `expires in <b>${res.daysLeft} day${res.daysLeft === 1 ? "" : "s"}</b>`;
          showMsg("soon", `✅ Welcome, <b>${res.name}</b>! (Entry: <b>${res.entryTime}</b>)${autoNote}<br><br>⏳ Reminder: Your plan ${dueText} (<b>${res.validUntil}</b>).<br>Please renew soon at reception.`);
        } else {
          showMsg("success", `✅ Welcome, <b>${res.name}</b>! (Entry: <b>${res.entryTime}</b>)${autoNote}<br><br>Plan valid until: <b>${res.validUntil}</b>`);
        }
      } catch (err) {
        formArea.style.display = "block";
        showMsg("error", `❌ ${err.message}`);
      }
    }

    document.getElementById("submit-btn").onclick = () => processScan(phoneInput.value.trim());

    resetBtn.onclick = () => {
      localStorage.removeItem("gym_phone");
      location.reload();
    };

    const savedPhone = localStorage.getItem("gym_phone");
    if (savedPhone) {
      phoneInput.value = savedPhone;
      resetBtn.style.display = "block";
      processScan(savedPhone);
    }
  </script>
</body>
</html>
