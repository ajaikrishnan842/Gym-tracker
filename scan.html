<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Planet Gym — Check-In / Out</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .box { background: #fff; padding: 28px; border-radius: 16px; width: 100%; max-width: 390px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    .gym-logo { width: 72px; height: 72px; object-fit: cover; border-radius: 14px; margin-bottom: 10px; }
    .gym-meta { margin: 0 0 16px; color: #64748b; font-size: 0.85rem; }
    input { width: 100%; padding: 14px; font-size: 1.1rem; border: 1.5px solid #cbd5e1; border-radius: 10px; margin: 12px 0; text-align: center; }
    button { width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; background: #2563eb; color: #fff; border: none; border-radius: 10px; cursor: pointer; }
    .status { padding: 16px; border-radius: 12px; margin-top: 16px; font-weight: 500; line-height: 1.45; }
    .success { background: #dcfce7; color: #166534; }
    .out { background: #dbeafe; color: #1e40af; border: 1.5px solid #60a5fa; }
    .soon { background: #fef9c3; color: #854d0e; border: 1.5px solid #eab308; }
    .warning { background: #fef2f2; color: #991b1b; border: 1.5px solid #ef4444; }
    .error { background: #fee2e2; color: #991b1b; }
    .self-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-top: 12px; text-align: left; }
    .self-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .self-stat { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
    .self-lbl { font-size: 0.72rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .self-val { font-size: 1.1rem; font-weight: 700; color: #0f172a; margin-top: 2px; }
    .wa-help { display: block; margin-top: 10px; background: #25D366; color: #fff; text-align: center; text-decoration: none; padding: 10px 12px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; }
    .link-btn { background: none; color: #64748b; font-size: 0.85rem; margin-top: 12px; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <img src="logo.png" alt="Fitness Planet Gym" class="gym-logo" onerror="this.style.display='none'" />
    <h2 style="margin:0 0 4px;">Fitness Planet Gym</h2>
    <p class="gym-meta">Periye • 📞 8606178119</p>
    <div id="form-area">
      <p style="color:#475569; margin:0; font-size:0.92rem;">Enter your registered 10-digit mobile number (saved for future visits):</p>
      <input id="phone" type="tel" maxlength="10" placeholder="9876543210" />
      <button id="submit-btn">Mark Entry / Exit</button>
    </div>
    <div id="result"></div>
    <div id="self-status"></div>
    <button id="reset-phone" class="link-btn" style="display:none;">Not your number? Change mobile</button>
  </div>

  <script type="module">
    import { db, getTodayIST } from "./firebase-config.js";
    import { doc, runTransaction, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    const GYM_WHATSAPP = "918606178119";
    const MAX_DAILY_SESSIONS = 2;
    const params = new URLSearchParams(window.location.search);
    const token = params.get("t");
    const formArea = document.getElementById("form-area");
    const resultEl = document.getElementById("result");
    const selfStatusEl = document.getElementById("self-status");
    const phoneInput = document.getElementById("phone");
    const resetBtn = document.getElementById("reset-phone");

    function showMsg(type, html) {
      resultEl.innerHTML = `<div class="status ${type}">${html}</div>`;
    }

    async function getMonthlyWorkoutCount(phone, monthPrefix) {
      try {
        const q = query(
          collection(db, "attendance"),
          where("phone", "==", phone),
          where("date", ">=", `${monthPrefix}-01`),
          where("date", "<=", `${monthPrefix}-31`)
        );
        const snap = await getDocs(q);
        return snap.size;
      } catch {
        return null;
      }
    }

    function renderSelfStatusCard(res, monthlyCount) {
      const daysDisplay = res.daysLeft < 0
        ? `Overdue (${Math.abs(res.daysLeft)}d)`
        : `${res.daysLeft} day${res.daysLeft === 1 ? "" : "s"}`;

      const workoutsDisplay = monthlyCount !== null ? `${monthlyCount} day${monthlyCount === 1 ? "" : "s"}` : "—";
      const planLabel = res.planName ? `${res.planName} • ` : "";

      let waButtonHtml = "";
      if (res.feeStatus === "EXPIRED" || res.feeStatus === "DUE_SOON") {
        const reason = res.feeStatus === "EXPIRED"
          ? `my gym fee expired on ${res.validUntil}`
          : `my gym fee is due on ${res.validUntil}`;
        const msg = encodeURIComponent(
          `Hi Fitness Planet Gym (Periye), I am ${res.name} (${phoneInput.value.trim() || ""}). ${reason} — sharing renewal details.`
        );
        waButtonHtml = `<a class="wa-help" target="_blank" href="https://wa.me/${GYM_WHATSAPP}?text=${msg}">💬 Message Reception on WhatsApp</a>`;
      }

      selfStatusEl.innerHTML = `
        <div class="self-card">
          <div style="font-size:0.78rem; font-weight:700; color:#475569; margin-bottom:8px;">
            ${planLabel}Valid until <b>${res.validUntil}</b>
          </div>
          <div class="self-grid">
            <div class="self-stat">
              <div class="self-lbl">Remaining</div>
              <div class="self-val">${daysDisplay}</div>
            </div>
            <div class="self-stat">
              <div class="self-lbl">This Month</div>
              <div class="self-val">${workoutsDisplay}</div>
            </div>
          </div>
          ${waButtonHtml}
        </div>
      `;
    }

    function formatDuration(startMs, endMs) {
      if (!startMs || !endMs || endMs <= startMs) return "";
      const mins = Math.round((endMs - startMs) / 60000);
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    function normalizeSessions(attData) {
      if (!attData) return [];
      if (Array.isArray(attData.sessions) && attData.sessions.length > 0) {
        return attData.sessions.map((s, i) => ({
          sessionNum: s.sessionNum || i + 1,
          entryTime: s.entryTime || "",
          entryAt: s.entryAt || null,
          exitTime: s.exitTime || "",
          exitAt: s.exitAt || null,
          duration: s.duration || "",
          status: s.status || (s.exitTime ? "OUT" : "IN")
        }));
      }
      const entryT = attData.entryTime || attData.time || "";
      if (!entryT) return [];
      return [{
        sessionNum: 1,
        entryTime: entryT,
        entryAt: attData.entryAt || null,
        exitTime: attData.exitTime || "",
        exitAt: attData.exitAt || null,
        duration: attData.duration || "",
        status: attData.status || (attData.exitTime ? "OUT" : "IN")
      }];
    }

    async function findUnclosedPreviousAttendance(phone, today) {
      const q = query(
        collection(db, "attendance"),
        where("phone", "==", phone),
        where("status", "==", "IN")
      );
      const snap = await getDocs(q);
      return snap.docs.filter(d => (d.data().date || "") < today);
    }

    async function processScan(phone) {
      if (!token) return showMsg("error", "No QR token found. Please scan the QR at reception.");
      if (!/^\d{10}$/.test(phone)) return showMsg("error", "Please enter a valid 10-digit mobile number.");

      formArea.style.display = "none";
      selfStatusEl.innerHTML = "";
      showMsg("", "Verifying QR...");

      const nowMs = Date.now();
      const today = getTodayIST();
      const istTime = new Date(nowMs).toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit" });

      try {
        const staleDocs = await findUnclosedPreviousAttendance(phone, today);
        const staleRefs = staleDocs.map(d => d.ref);

        const res = await runTransaction(db, async (tx) => {
          const tokenRef = doc(db, "qr_tokens", "current");
          const memberRef = doc(db, "members", phone);
          const todayAttRef = doc(db, "attendance", `${today}_${phone}`);

          const reads = [
            tx.get(tokenRef),
            tx.get(memberRef),
            tx.get(todayAttRef),
            ...staleRefs.map(ref => tx.get(ref))
          ];
          const [tokenSnap, memberSnap, todayAttSnap, ...staleSnaps] = await Promise.all(reads);

          if (!tokenSnap.exists()) throw new Error("Kiosk QR is not active. Ask reception.");
          const tData = tokenSnap.data();

          if (tData.token !== token) throw new Error("QR expired. Please scan the fresh QR on screen.");
          if (tData.used) throw new Error("This QR was already used. Scan the fresh QR on screen.");
          if (!memberSnap.exists()) throw new Error("Mobile number not registered. Please contact 8606178119.");

          const member = memberSnap.data();
          const daysLeft = Math.round(
            (new Date(member.validUntil + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000
          );

          let feeStatus = "ACTIVE";
          if (daysLeft < 0) feeStatus = "EXPIRED";
          else if (daysLeft <= 5) feeStatus = "DUE_SOON";

          const closedPreviousDates = [];
          staleSnaps.forEach((sSnap, idx) => {
            if (sSnap.exists()) {
              const prevData = sSnap.data();
              const prevSessions = normalizeSessions(prevData);
              let closedAny = false;
              const updatedPrev = prevSessions.map(s => {
                if (s.status === "IN" && !s.exitTime) {
                  closedAny = true;
                  return { ...s, status: "AUTO_CLOSED", exitTime: "Forgot Exit" };
                }
                return s;
              });
              if (closedAny || prevData.status === "IN") {
                closedPreviousDates.push(prevData.date);
                const lastPrev = updatedPrev[updatedPrev.length - 1];
                tx.update(staleRefs[idx], {
                  sessions: updatedPrev,
                  status: "AUTO_CLOSED",
                  exitTime: lastPrev?.exitTime || "Forgot Exit",
                  autoClosedOn: today,
                  lastTokenUsed: token
                });
              }
            }
          });

          const existingSessions = todayAttSnap.exists() ? normalizeSessions(todayAttSnap.data()) : [];
          const openIdx = existingSessions.findIndex(s => s.status === "IN" && !s.exitTime);

          if (openIdx !== -1) {
            const openSess = existingSessions[openIdx];
            const duration = formatDuration(openSess.entryAt || nowMs, nowMs);
            const closedSess = {
              ...openSess,
              exitTime: istTime,
              exitAt: nowMs,
              duration: duration || "",
              status: "OUT"
            };
            const nextSessions = [...existingSessions];
            nextSessions[openIdx] = closedSess;

            const hasMoreSessions = nextSessions.length < MAX_DAILY_SESSIONS;
            tx.set(todayAttRef, {
              date: today,
              time: nextSessions[0].entryTime,
              entryTime: nextSessions[0].entryTime,
              entryAt: nextSessions[0].entryAt || nowMs,
              exitTime: istTime,
              exitAt: nowMs,
              duration: duration || "",
              status: hasMoreSessions ? "OUT" : "COMPLETED",
              sessions: nextSessions,
              phone,
              name: member.name,
              feeStatus,
              tokenUsed: nextSessions[0].tokenUsed || token,
              lastTokenUsed: token
            }, { merge: true });

            tx.update(tokenRef, {
              used: true,
              actionType: "EXIT",
              sessionNum: closedSess.sessionNum,
              usedBy: member.name,
              scanTime: istTime,
              duration,
              feeStatus,
              daysLeft,
              validUntil: member.validUntil
            });

            return {
              mode: "EXIT",
              sessionNum: closedSess.sessionNum,
              name: member.name,
              planName: member.planName || "",
              entryTime: closedSess.entryTime,
              exitTime: istTime,
              duration,
              validUntil: member.validUntil,
              feeStatus,
              daysLeft,
              closedPreviousDates
            };
          }

          if (existingSessions.length >= MAX_DAILY_SESSIONS) {
            throw new Error(`Maximum ${MAX_DAILY_SESSIONS} entry/exit sessions per day already completed.`);
          }

          const sessionNum = existingSessions.length + 1;
          const newSess = {
            sessionNum,
            entryTime: istTime,
            entryAt: nowMs,
            exitTime: "",
            exitAt: null,
            duration: "",
            status: "IN"
          };
          const nextSessions = [...existingSessions, newSess];

          tx.set(todayAttRef, {
            date: today,
            time: sessionNum === 1 ? istTime : (todayAttSnap.data()?.time || istTime),
            entryTime: sessionNum === 1 ? istTime : (todayAttSnap.data()?.entryTime || istTime),
            entryAt: sessionNum === 1 ? nowMs : (todayAttSnap.data()?.entryAt || nowMs),
            exitTime: "",
            exitAt: null,
            status: "IN",
            sessions: nextSessions,
            phone,
            name: member.name,
            feeStatus,
            tokenUsed: token,
            lastTokenUsed: token
          }, { merge: true });

          tx.update(tokenRef, {
            used: true,
            actionType: "ENTRY",
            sessionNum,
            usedBy: member.name,
            scanTime: istTime,
            feeStatus,
            daysLeft,
            validUntil: member.validUntil
          });

          return {
            mode: "ENTRY",
            sessionNum,
            name: member.name,
            planName: member.planName || "",
            entryTime: istTime,
            validUntil: member.validUntil,
            feeStatus,
            daysLeft,
            closedPreviousDates
          };
        });

        localStorage.setItem("gym_phone", phone);
        resetBtn.style.display = "block";

        const autoNote = res.closedPreviousDates.length
          ? `<br><span style="font-size:0.84rem; opacity:0.9;">(Closed previous open check-in from ${res.closedPreviousDates.join(", ")})</span>`
          : "";

        if (res.mode === "EXIT") {
          const durText = res.duration ? `<br>Duration: <b>${res.duration}</b>` : "";
          showMsg("out", `👋 Check Out — <b>${res.name}</b> (Session ${res.sessionNum})<br><br>Entry: <b>${res.entryTime || "—"}</b> • Exit: <b>${res.exitTime}</b>${durText}${autoNote}`);
        } else {
          const sessTag = `Session ${res.sessionNum} of ${MAX_DAILY_SESSIONS}`;
          if (res.feeStatus === "EXPIRED") {
            showMsg("warning", `✅ Entry Marked for <b>${res.name}</b> (${sessTag}) at <b>${res.entryTime}</b>${autoNote}<br><br>⚠️ <b>Fee Expired on ${res.validUntil}</b>.<br>Please renew your membership at reception.`);
          } else if (res.feeStatus === "DUE_SOON") {
            const dueText = res.daysLeft === 0 ? "expires <b>today</b>" : `expires in <b>${res.daysLeft} day${res.daysLeft === 1 ? "" : "s"}</b>`;
            showMsg("soon", `✅ Welcome, <b>${res.name}</b>! (${sessTag} • Entry: <b>${res.entryTime}</b>)${autoNote}<br><br>⏳ Reminder: Your plan ${dueText} (<b>${res.validUntil}</b>).<br>Please renew soon at reception.`);
          } else {
            showMsg("success", `✅ Welcome, <b>${res.name}</b>! (${sessTag} • Entry: <b>${res.entryTime}</b>)${autoNote}<br><br>Plan valid until: <b>${res.validUntil}</b>`);
          }
        }

        const monthlyCount = await getMonthlyWorkoutCount(phone, today.slice(0, 7));
        renderSelfStatusCard(res, monthlyCount);
      } catch (err) {
        formArea.style.display = "block";
        showMsg("error", `❌ ${err.message}`);
      }
    }

    document.getElementById("submit-btn").onclick = () => processScan(phoneInput.value.trim());

    resetBtn.onclick = () => {
      localStorage.removeItem("gym_phone");
      location.reload();
    };

    const savedPhone = localStorage.getItem("gym_phone");
    if (savedPhone) {
      phoneInput.value = savedPhone;
      resetBtn.style.display = "block";
      processScan(savedPhone);
    }
  </script>
</body>
</html>
