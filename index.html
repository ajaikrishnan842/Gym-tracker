<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <title>Fitness Planet Gym — Check-In Kiosk</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
    .card { background: #1e293b; padding: 28px 32px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    .gym-logo { width: 96px; height: 96px; object-fit: cover; border-radius: 16px; margin-bottom: 12px; border: 2px solid #334155; }
    h1, h2 { margin: 0 0 4px; }
    h1 { font-size: 1.55rem; letter-spacing: 0.01em; }
    .gym-meta { margin: 0 0 18px; color: #94a3b8; font-size: 0.9rem; font-weight: 500; }
    p.sub { margin: 0 0 18px; color: #cbd5e1; font-size: 0.92rem; }
    input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.95rem; }
    button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    #login-err { color: #f87171; font-size: 0.85rem; margin-top: 10px; min-height: 18px; }
    #qr-box { background: #fff; padding: 18px; border-radius: 16px; display: inline-block; margin-bottom: 18px; }
    .bar-bg { width: 100%; height: 10px; background: #334155; border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
    #bar { height: 100%; width: 100%; background: #22c55e; transition: width 1s linear; }
    #timer { font-size: 1.05rem; font-weight: 600; color: #cbd5e1; }
    #overlay { display: none; padding: 28px 16px; border-radius: 16px; margin-bottom: 12px; }
    .ok { background: #14532d; border: 2px solid #22c55e; }
    .out { background: #1e3a8a; border: 2px solid #60a5fa; }
    .soon { background: #713f12; border: 2px solid #eab308; }
    .warn { background: #7f1d1d; border: 2px solid #ef4444; }
    .footer-links { margin-top: 22px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .footer-btn { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 10px; padding: 8px 14px; width: auto; font-size: 0.85rem; font-weight: 600; }
    .footer-btn.ghost { background: none; border-color: transparent; color: #94a3b8; padding: 8px 10px; }

    /* 4-Digit PIN Modal */
    .pin-bg { display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.75); align-items: center; justify-content: center; padding: 20px; z-index: 50; }
    .pin-card { background: #1e293b; border: 1px solid #334155; border-radius: 18px; padding: 24px; width: 100%; max-width: 320px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .pin-input { text-align: center; font-size: 1.5rem; letter-spacing: 0.55rem; font-weight: 700; padding: 12px; margin: 14px 0 8px; }
    .pin-err { color: #f87171; font-size: 0.84rem; min-height: 18px; margin-bottom: 10px; }
    .pin-actions { display: flex; gap: 10px; }
    .pin-actions button.cancel { background: #334155; color: #e2e8f0; }
  </style>
</head>
<body>
  <div id="login-card" class="card">
    <img src="logo.png" alt="Fitness Planet Gym" class="gym-logo" onerror="this.style.display='none'" />
    <h2>Fitness Planet Gym</h2>
    <p class="gym-meta">Periye • 📞 8606178119</p>
    <input id="email" type="email" placeholder="Owner Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="login-btn">Start Kiosk</button>
    <div id="login-err"></div>
  </div>

  <div id="kiosk-card" class="card" style="display:none;">
    <img src="logo.png" alt="Fitness Planet Gym" class="gym-logo" onerror="this.style.display='none'" />
    <h1>Fitness Planet Gym</h1>
    <p class="gym-meta">Periye • 📞 8606178119</p>
    <p class="sub">Scan with your phone camera to mark attendance</p>

    <div id="overlay"></div>

    <div id="qr-section">
      <div id="qr-box"><div id="qrcode"></div></div>
      <div class="bar-bg"><div id="bar"></div></div>
      <div id="timer">Refreshing in 30s</div>
    </div>
  </div>

  <div id="footer" class="footer-links" style="display:none;">
    <button id="sound-btn" class="footer-btn ghost">🔊 Sound: On</button>
    <button id="admin-btn" class="footer-btn">🔒 Admin Dashboard</button>
    <button id="logout-btn" class="footer-btn ghost">Sign Out</button>
  </div>

  <!-- 4-Digit Admin PIN Modal -->
  <div id="pin-modal" class="pin-bg">
    <div class="pin-card">
      <h3 style="margin:0 0 4px;">Admin PIN</h3>
      <p style="margin:0; color:#94a3b8; font-size:0.86rem;">Enter 4-digit PIN to open dashboard</p>
      <input id="pin-input" class="pin-input" type="password" inputmode="numeric" maxlength="4" pattern="\d{4}" placeholder="••••" autocomplete="off" />
      <div id="pin-err" class="pin-err"></div>
      <div class="pin-actions">
        <button id="pin-submit">Unlock</button>
        <button id="pin-cancel" class="cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, auth } from "./firebase-config.js";
    import { doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
    import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

    const DEFAULT_PIN = "9842";
    const PIN_STORAGE_KEY = "fp_admin_custom_pin";

    function getActiveAdminPin() {
      const saved = localStorage.getItem(PIN_STORAGE_KEY);
      return saved && /^\d{4}$/.test(saved) ? saved : DEFAULT_PIN;
    }

    const DURATION = 30;
    const currentTokenRef = doc(db, "qr_tokens", "current");

    let countdown = DURATION;
    let timerId = null;
    let activeToken = null;
    let unsubToken = null;
    let wakeLock = null;
    let soundEnabled = true;
    let audioCtx = null;

    const loginCard = document.getElementById("login-card");
    const kioskCard = document.getElementById("kiosk-card");
    const footer = document.getElementById("footer");
    const loginErr = document.getElementById("login-err");
    const qrContainer = document.getElementById("qrcode");
    const qrSection = document.getElementById("qr-section");
    const overlay = document.getElementById("overlay");
    const timerEl = document.getElementById("timer");
    const barEl = document.getElementById("bar");
    const soundBtn = document.getElementById("sound-btn");
    const adminBtn = document.getElementById("admin-btn");
    const pinModal = document.getElementById("pin-modal");
    const pinInput = document.getElementById("pin-input");
    const pinErr = document.getElementById("pin-err");

    function openPinModal() {
      pinErr.textContent = "";
      pinInput.value = "";
      pinModal.style.display = "flex";
      setTimeout(() => pinInput.focus(), 50);
    }

    function closePinModal() {
      pinModal.style.display = "none";
      pinInput.value = "";
      pinErr.textContent = "";
    }

    function verifyPin() {
      const entered = pinInput.value.replace(/\D/g, "");
      if (entered.length !== 4) {
        pinErr.textContent = "Enter a 4-digit PIN.";
        return;
      }
      if (entered !== getActiveAdminPin()) {
        pinErr.textContent = "Incorrect PIN.";
        pinInput.value = "";
        pinInput.focus();
        return;
      }
      sessionStorage.setItem("fp_admin_pin_ok", "1");
      window.location.href = "admin.html";
    }

    adminBtn.onclick = openPinModal;
    document.getElementById("pin-cancel").onclick = closePinModal;
    document.getElementById("pin-submit").onclick = verifyPin;
    pinInput.onkeydown = (e) => {
      if (e.key === "Enter") verifyPin();
      if (e.key === "Escape") closePinModal();
    };
    pinModal.onclick = (e) => {
      if (e.target === pinModal) closePinModal();
    };

    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    document.addEventListener("click", unlockAudio, { once: true });

    soundBtn.onclick = () => {
      unlockAudio();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔊 Sound: On" : "🔇 Sound: Off";
    };

    function beep(freq, duration, startOffset, type = "sine", vol = 0.25) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime + startOffset);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startOffset + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + startOffset);
      osc.stop(audioCtx.currentTime + startOffset + duration);
    }

    function playCheckInSound(feeStatus, actionType) {
      if (!soundEnabled) return;
      unlockAudio();
      if (actionType === "EXIT") {
        beep(784, 0.14, 0, "sine", 0.22);
        beep(587, 0.20, 0.15, "sine", 0.22);
        return;
      }
      if (feeStatus === "EXPIRED") {
        beep(220, 0.22, 0, "sawtooth", 0.2);
        beep(180, 0.30, 0.28, "sawtooth", 0.2);
      } else if (feeStatus === "DUE_SOON") {
        beep(660, 0.14, 0, "triangle", 0.25);
        beep(660, 0.18, 0.20, "triangle", 0.25);
      } else {
        beep(880, 0.14, 0, "sine", 0.25);
        beep(1174, 0.22, 0.15, "sine", 0.25);
      }
    }

    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch { /* ignored if unsupported or battery saver */ }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && auth.currentUser) requestWakeLock();
    });

    function randomToken() {
      return "tk_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }

    async function generateNewQR() {
      if (timerId) clearInterval(timerId);
      overlay.style.display = "none";
      qrSection.style.display = "block";

      const token = randomToken();
      activeToken = token;

      await setDoc(currentTokenRef, { token, createdAt: Date.now(), used: false });

      const scanUrl = new URL("scan.html?t=" + token, window.location.href).href;
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, { text: scanUrl, width: 240, height: 240 });

      countdown = DURATION;
      updateBar();

      timerId = setInterval(() => {
        countdown--;
        updateBar();
        if (countdown <= 0) generateNewQR();
      }, 1000);
    }

    function updateBar() {
      timerEl.textContent = `Refreshing in ${countdown}s`;
      barEl.style.width = `${(countdown / DURATION) * 100}%`;
      barEl.style.background = countdown <= 8 ? "#f59e0b" : "#22c55e";
    }

    function showWelcome(data) {
      playCheckInSound(data.feeStatus, data.actionType);
      qrSection.style.display = "none";
      overlay.style.display = "block";

      if (data.actionType === "EXIT") {
        overlay.className = "out";
        const sessionLabel = data.sessionNum ? `Session ${data.sessionNum} • ` : "";
        const durLine = data.duration ? `<br>Duration: ${data.duration}` : "";
        overlay.innerHTML = `
          <h2 style="margin:0 0 8px;">Check Out (${data.scanTime || ""})</h2>
          <div style="font-size:1.3rem; font-weight:700;">${data.usedBy}</div>
          <p style="margin:8px 0 0; font-size:0.9rem; opacity:0.95;">${sessionLabel}Exit marked${durLine}</p>
        `;
        setTimeout(generateNewQR, 2500);
        return;
      }

      const sessionLabel = data.sessionNum ? `Session ${data.sessionNum} • ` : "";
      let cls = "ok", title = `✅ Checked In (${data.scanTime || ""})`, msg = `${sessionLabel}Valid until ${data.validUntil}`;
      if (data.feeStatus === "EXPIRED") {
        cls = "warn";
        title = "⚠️ Fee Overdue";
        msg = `${sessionLabel}Expired on ${data.validUntil}. Please renew at desk.`;
      } else if (data.feeStatus === "DUE_SOON") {
        cls = "soon";
        title = "⏳ Fee Due Soon";
        const d = data.daysLeft;
        msg = sessionLabel + (d === 0 ? `Expires today (${data.validUntil}). Please renew at desk.` : `Expires in ${d} day${d === 1 ? "" : "s"} (${data.validUntil}).`);
      }

      overlay.className = cls;
      overlay.innerHTML = `
        <h2 style="margin:0 0 8px;">${title}</h2>
        <div style="font-size:1.3rem; font-weight:700;">${data.usedBy}</div>
        <p style="margin:8px 0 0; font-size:0.9rem; opacity:0.95;">${msg}</p>
      `;
      setTimeout(generateNewQR, 2500);
    }

    document.getElementById("login-btn").onclick = async () => {
      unlockAudio();
      loginErr.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("email").value.trim(), document.getElementById("password").value);
      } catch (err) {
        loginErr.textContent = err.code + ": " + err.message;
      }
    };

    document.getElementById("logout-btn").onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginCard.style.display = "none";
        kioskCard.style.display = "block";
        footer.style.display = "flex";
        requestWakeLock();

        if (!unsubToken) {
          unsubToken = onSnapshot(currentTokenRef, (snap) => {
            const data = snap.data();
            if (data && data.token === activeToken && data.used) {
              activeToken = null;
              clearInterval(timerId);
              showWelcome(data);
            }
          });
        }
        generateNewQR();
      } else {
        if (timerId) clearInterval(timerId);
        if (unsubToken) { unsubToken(); unsubToken = null; }
        if (wakeLock) { wakeLock.release(); wakeLock = null; }
        activeToken = null;
        loginCard.style.display = "block";
        kioskCard.style.display = "none";
        footer.style.display = "none";
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
